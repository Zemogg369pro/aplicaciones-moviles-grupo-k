name: almacenamiento_local
description: Local storage (SharedPreferences), Hive y SQLite en Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2   # inicio de sesión y preferencias
  hive: ^2.2.3                 # datos de usuario y caché
  hive_flutter: ^1.1.0
  sqflite: ^2.3.3+1            # información de la aplicación (registros estructurados)
  path: ^1.9.0
  http: ^1.2.2
  crypto: ^3.0.5
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
