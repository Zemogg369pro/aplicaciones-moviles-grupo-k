name: camara_deteccion
description: Cámara inteligente con detección de objetos local (YOLOv8 + TensorFlow Lite)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  flutter_vision: ^1.1.4        # YOLOv8 sobre TensorFlow Lite (procesamiento local)
  image_picker: ^1.1.2
  video_player: ^2.9.1
  video_thumbnail: ^0.5.3       # extrae el fotograma del video en pausa
  image: ^4.2.0                 # dibuja recuadros/etiquetas sobre la foto a guardar
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  share_plus: ^10.0.2
  permission_handler: ^11.3.1
  intl: ^0.19.0

flutter:
  uses-material-design: true
  assets:
    - assets/
